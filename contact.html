<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Contact portfolio owner">

    <title>Contact</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>Contact Me</h1>

    <nav aria-label="Main Navigation">

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="projects.html">Projects</a></li>

            <li><a href="contact.html"
                aria-current="page">Contact</a></li>

        </ul>

    </nav>

</header>

<main>

<section class="contact-section"
    aria-labelledby="contact-heading">

    <h2 id="contact-heading">
        Get In Touch
    </h2>

    <form aria-label="Contact Form">

        <div>

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                required>

        </div>

        <div>

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required>

        </div>

        <div>

            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                name="message"
                rows="5"
                required></textarea>

        </div>

        <button type="submit">
            Send Message
        </button>

    </form>

</section>

</main>

<footer>

    <p>
        © 2026 My Portfolio
    </p>

</footer>

</body>

</html>
